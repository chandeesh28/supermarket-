<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SuperMarket Management</title>
    <link rel="stylesheet" href="register-style.css">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="header">
                <h1>Create Account</h1>
                <p>Setup your supermarket profile</p>
            </div>
            
            <form id="registerForm">
                <div class="form-row">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Your full name" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Shop Name</label>
                        <input type="text" id="shopName" placeholder="Shop name" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Shop Address</label>
                    <textarea id="address" rows="3" placeholder="Complete shop address" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label>Age</label>
                        <input type="number" id="age" min="18" placeholder="Age" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Shop Location</label>
                        <input list="locations" id="location" placeholder="Select location" required>
                        <datalist id="locations">
                            <option value="Chennai">
                            <option value="Bangalore">
                            <option value="Hyderabad">
                            <option value="Coimbatore">
                            <option value="Madurai">
                            <option value="Trichy">
                        </datalist>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                
                <div class="input-group">
                    <label>Shop Type</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="shopType" value="Mall" required>
                            Mall
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="shopType" value="Supermarket">
                            Supermarket
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="shopType" value="Grocery">
                            Grocery
                        </label>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Choose username" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Create password" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                </div>
                
                <button type="submit" class="btn-register">Create Account</button>
                
                <p class="link-text">
                    Already have an account? 
                    <a href="index.html">Login</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var age = parseInt(document.getElementById('age').value);
            
            if (age < 18) {
                alert('You must be at least 18 years old!');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            var shopType = document.querySelector('input[name="shopType"]:checked');
            if (!shopType) {
                alert('Please select a shop type!');
                return;
            }
            
            var user = {
                name: document.getElementById('name').value,
                shopName: document.getElementById('shopName').value,
                address: document.getElementById('address').value,
                age: age,
                location: document.getElementById('location').value,
                email: document.getElementById('email').value,
                shopType: shopType.value,
                username: document.getElementById('username').value,
                password: password
            };
            
            var users = JSON.parse(localStorage.getItem('users')) || [];
            
            for (var i = 0; i < users.length; i++) {
                if (users[i].username === user.username) {
                    alert('Username already exists!');
                    return;
                }
            }
            
            users.push(user);
            localStorage.setItem('users', JSON.stringify(users));
            
            alert('Account created successfully!');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
