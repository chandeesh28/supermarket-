<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - SuperMarket Management</title>
    <link rel="stylesheet" href="inventory-style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h2>SuperMarket</h2>
            </div>
            <nav class="menu">
                <a href="owner-dashboard.html">Dashboard</a>
                <a href="billing-page.html">Billing</a>
                <a href="inventory-page.html" class="active">Inventory</a>
                <a href="reports-page.html">Reports</a>
                <a href="suppliers-page.html">Suppliers</a>
                <a href="ledger-page.html">Ledger</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header-section">
                <h1>Inventory Management</h1>
                <button class="btn-add" onclick="openAddModal()">+ Add Product</button>
            </div>

            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="card card-blue">
                    <div class="card-icon">📦</div>
                    <div class="card-info">
                        <h3>Total Products</h3>
                        <p class="amount" id="totalProducts">0</p>
                    </div>
                </div>
                <div class="card card-green">
                    <div class="card-icon">✅</div>
                    <div class="card-info">
                        <h3>Available</h3>
                        <p class="amount" id="availableProducts">0</p>
                    </div>
                </div>
                <div class="card card-orange">
                    <div class="card-icon">⚠️</div>
                    <div class="card-info">
                        <h3>Low Stock</h3>
                        <p class="amount" id="lowStockProducts">0</p>
                    </div>
                </div>
                <div class="card card-red">
                    <div class="card-icon">❌</div>
                    <div class="card-info">
                        <h3>Not Available</h3>
                        <p class="amount" id="notAvailableProducts">0</p>
                    </div>
                </div>
            </div>

            <!-- Inventory Table -->
            <div class="table-section">
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Stock</th>
                            <th>Unit</th>
                            <th>Min Stock</th>
                            <th>Trader Name</th>
                            <th>Trader Code</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <tr>
                            <td colspan="9" style="text-align: center; color: #999;">No products available</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Product</h2>
                <span class="close" onclick="closeAddModal()">&times;</span>
            </div>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Stock</label>
                        <input type="number" id="stock" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Unit</label>
                        <select id="unit" required>
                            <option value="">Select Unit</option>
                            <option value="Kg">Kg</option>
                            <option value="Gram">Gram</option>
                            <option value="Litre">Litre</option>
                            <option value="Piece">Piece</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Minimum Stock</label>
                    <input type="number" id="minStock" min="0" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Trader Name</label>
                        <input type="text" id="traderName" required>
                    </div>
                    <div class="form-group">
                        <label>Trader Code</label>
                        <input type="text" id="traderCode" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Add Product</button>
            </form>
        </div>
    </div>

    <script src="inventory-script.js"></script>
</body>
</html>
