<!DOCTYPE html>
<html>
<head>
    <title>Billing - Supermarket POS</title>
    <link rel="stylesheet" href="billing.css">
</head>
<body>

<header>
    <h1>Supermarket Billing (POS)</h1>
</header>

<div class="billing-container">

    <!-- Barcode Section -->
    <div class="barcode-section">
        <label>Scan Barcode</label>
        <input type="text" placeholder="Scan or Enter Barcode">
        <button class="scan-btn">Add</button>
    </div>

    <!-- Manual Product Entry -->
    <div class="product-entry">
        <h3>Manual Entry</h3>

        <input type="text" placeholder="Product Name">
        <input type="number" placeholder="Price">
        <input type="number" placeholder="Quantity">

        <button class="add-btn">Add to Cart</button>
    </div>

    <!-- Bill Table -->
    <div class="bill-table">
        <table>
            <thead>
                <tr>
                    <th>Barcode</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Remove</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>123456</td>
                    <td>Sample Item</td>
                    <td>50</td>
                    <td>2</td>
                    <td>100</td>
                    <td><button class="remove-btn">X</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Total Section -->
    <div class="total-section">
        <div>
            <p>Subtotal: ₹ 100</p>
            <p>GST (5%): ₹ 5</p>
            <p>Discount: ₹ 0</p>
            <h2>Final Total: ₹ 105</h2>
        </div>

        <div class="payment">
            <label>Payment Mode</label>
            <select>
                <option>Cash</option>
                <option>UPI</option>
                <option>Card</option>
            </select>

            <button class="generate-btn">Generate Bill</button>
        </div>
    </div>

</div>

</body>
</html>
