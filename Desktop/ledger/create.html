<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account | Supermarket Ledger</title>
    <link rel="stylesheet" href="loginstyle1.css">
</head>
<body>

<div class="container">

    <div class="box">
        <h2>Create Account</h2>

        <form>
            <label>Name</label>
            <input type="text" placeholder="Your full name" required>

            <label>Shop Name</label>
            <input type="text" placeholder="Shop name" required>

            <label>Address</label>
            <textarea placeholder="Shop address" required></textarea>

            <label>Age</label>
            <input type="number" min="18" placeholder="Age" required>

            <label>Shop Location</label>
            <input list="locations" placeholder="Select location" required>
            <datalist id="locations">
                <option value="Chennai">
                <option value="Bangalore">
                <option value="Hyderabad">
                <option value="Coimbatore">
                <option value="Madurai">
                <option value="Trichy">
            </datalist>

            <label>Email</label>
            <input type="email" placeholder="Email address" required>

            <label>Shop Type</label>
            <div class="checkbox-group">
                <label><input type="radio" name="shoptype"> Mall</label>
                <label><input type="radio" name="shoptype"> Supermarket</label>
                <label><input type="radio" name="shoptype"> Grocery</label>
            </div>

            <label>Username</label>
            <input type="text" placeholder="Create username" required>

            <label>Password</label>
            <input type="password" placeholder="Create password" required>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password" required>

            <button type="submit">Create Account</button>

            <p class="switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </form>
    </div>

</div>

</body>
</html>
