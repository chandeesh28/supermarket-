<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refill Request - SuperMarket Management</title>
    <link rel="stylesheet" href="refill-style.css">
</head>
<body>
    <div class="container">
        <div class="refill-box">
            <div class="header">
                <h1>Refill / Purchase Request</h1>
                <p>Request stock refill for product</p>
            </div>

            <div class="product-details">
                <h3>Product Details</h3>
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="label">Product ID:</span>
                        <span class="value" id="productId">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Product Name:</span>
                        <span class="value" id="productName">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Current Stock:</span>
                        <span class="value" id="currentStock">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Unit:</span>
                        <span class="value" id="unit">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Minimum Stock:</span>
                        <span class="value" id="minStock">-</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Trader:</span>
                        <span class="value" id="trader">-</span>
                    </div>
                </div>
            </div>

            <form id="refillForm">
                <div class="form-group">
                    <label>Refill Quantity</label>
                    <input type="number" id="refillQty" min="1" placeholder="Enter quantity to order" required>
                </div>

                <div class="form-group">
                    <label>Expected Delivery Date</label>
                    <input type="date" id="deliveryDate" required>
                </div>

                <div class="form-group">
                    <label>Notes (Optional)</label>
                    <textarea id="notes" rows="4" placeholder="Additional instructions or remarks"></textarea>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-submit">Send Request to Dealer</button>
                    <button type="button" class="btn-cancel" onclick="cancelRefill()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function checkAuth() {
            var user = localStorage.getItem('loggedInUser');
            if (!user) {
                window.location.href = 'index.html';
                return null;
            }
            return JSON.parse(user);
        }

        function getQueryParam(param) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function loadProductDetails() {
            checkAuth();
            
            var productId = getQueryParam('id');
            if (!productId) {
                alert('No product selected!');
                window.location.href = 'inventory-page.html';
                return;
            }

            var products = JSON.parse(localStorage.getItem('products')) || [];
            var product = null;
            
            for (var i = 0; i < products.length; i++) {
                if (products[i].id === productId) {
                    product = products[i];
                    break;
                }
            }

            if (!product) {
                alert('Product not found!');
                window.location.href = 'inventory-page.html';
                return;
            }

            document.getElementById('productId').textContent = product.id;
            document.getElementById('productName').textContent = product.name;
            document.getElementById('currentStock').textContent = product.stock;
            document.getElementById('unit').textContent = product.unit;
            document.getElementById('minStock').textContent = product.minStock;
            document.getElementById('trader').textContent = product.traderName + ' (' + product.traderCode + ')';

            var today = new Date();
            var tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            var minDate = tomorrow.toISOString().split('T')[0];
            document.getElementById('deliveryDate').setAttribute('min', minDate);
        }

        function cancelRefill() {
            window.location.href = 'inventory-page.html';
        }

        document.getElementById('refillForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var productId = getQueryParam('id');
            var refillQty = parseInt(document.getElementById('refillQty').value);
            
            var products = JSON.parse(localStorage.getItem('products')) || [];
            
            for (var i = 0; i < products.length; i++) {
                if (products[i].id === productId) {
                    products[i].stock += refillQty;
                    break;
                }
            }
            
            localStorage.setItem('products', JSON.stringify(products));
            
            alert('Refill request sent successfully! Stock updated.');
            window.location.href = 'inventory-page.html';
        });

        loadProductDetails();
    </script>
</body>
</html>
