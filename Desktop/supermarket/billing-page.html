<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - SuperMarket Management</title>
    <link rel="stylesheet" href="billing-style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h2>SuperMarket</h2>
            </div>
            <nav class="menu">
                <a href="owner-dashboard.html">Dashboard</a>
                <a href="billing-page.html" class="active">Billing</a>
                <a href="inventory-page.html">Inventory</a>
                <a href="reports-page.html">Reports</a>
                <a href="suppliers-page.html">Suppliers</a>
                <a href="ledger-page.html">Ledger</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <h1>Point of Sale (POS)</h1>

            <!-- Barcode Section -->
            <div class="barcode-section">
                <h3>Scan Barcode</h3>
                <div class="barcode-input">
                    <input type="text" id="barcodeInput" placeholder="Scan or enter product barcode" autofocus>
                    <button onclick="scanBarcode()">Add</button>
                </div>
            </div>

            <div class="billing-grid">
                <!-- Manual Product Entry -->
                <div class="manual-entry">
                    <h3>Manual Product Entry</h3>
                    <form id="manualForm">
                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" id="manualName" required>
                        </div>
                        <div class="form-group">
                            <label>Price (₹)</label>
                            <input type="number" id="manualPrice" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" id="manualQty" min="1" value="1" required>
                        </div>
                        <button type="submit" class="btn-add">Add to Cart</button>
                    </form>
                </div>

                <!-- Bill Section -->
                <div class="bill-section">
                    <h3>Bill Items</h3>
                    <div class="bill-table-container">
                        <table class="bill-table">
                            <thead>
                                <tr>
                                    <th>Barcode</th>
                                    <th>Product</th>
                                    <th>Price</th>
                                    <th>Qty</th>
                                    <th>Total</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>
                            <tbody id="billTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center; color: #999;">No items in cart</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Total Section -->
                    <div class="total-section">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">₹0.00</span>
                        </div>
                        <div class="total-row">
                            <span>GST (5%):</span>
                            <span id="gst">₹0.00</span>
                        </div>
                        <div class="total-row">
                            <span>Discount:</span>
                            <span id="discount">₹0.00</span>
                        </div>
                        <div class="total-row final">
                            <span>Final Total:</span>
                            <span id="finalTotal">₹0.00</span>
                        </div>
                        
                        <div class="form-group">
                            <label>Payment Mode</label>
                            <select id="paymentMode">
                                <option value="Cash">Cash</option>
                                <option value="UPI">UPI</option>
                                <option value="Card">Card</option>
                            </select>
                        </div>
                        
                        <button onclick="generateBill()" class="btn-generate">Generate Bill</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="billing-script.js"></script>
</body>
</html>
