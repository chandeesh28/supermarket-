<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger - SuperMarket Management</title>
    <link rel="stylesheet" href="ledger-style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h2>SuperMarket</h2>
            </div>
            <nav class="menu">
                <a href="owner-dashboard.html">Dashboard</a>
                <a href="billing-page.html">Billing</a>
                <a href="inventory-page.html">Inventory</a>
                <a href="reports-page.html">Reports</a>
                <a href="suppliers-page.html">Suppliers</a>
                <a href="ledger-page.html" class="active">Ledger</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header-section">
                <h1>Ledger Management</h1>
                <button class="btn-add" onclick="openAddModal()">+ Add Transaction</button>
            </div>

            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="card card-green">
                    <div class="card-icon">💵</div>
                    <div class="card-info">
                        <h3>Total Cash In</h3>
                        <p class="amount" id="totalCashIn">₹0</p>
                    </div>
                </div>
                <div class="card card-red">
                    <div class="card-icon">💸</div>
                    <div class="card-info">
                        <h3>Total Cash Out</h3>
                        <p class="amount" id="totalCashOut">₹0</p>
                    </div>
                </div>
                <div class="card card-blue">
                    <div class="card-icon">💰</div>
                    <div class="card-info">
                        <h3>Current Balance</h3>
                        <p class="amount" id="currentBalance">₹0</p>
                    </div>
                </div>
            </div>

            <!-- Ledger Table -->
            <div class="table-section">
                <h3>Transaction History</h3>
                <table class="ledger-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Mode</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #999;">No transactions</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Transaction Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Transaction</h2>
                <span class="close" onclick="closeAddModal()">&times;</span>
            </div>
            <form id="addTransactionForm">
                <div class="form-group">
                    <label>Transaction Type</label>
                    <select id="transType" required>
                        <option value="">Select Type</option>
                        <option value="Cash In">Cash In</option>
                        <option value="Cash Out">Cash Out</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="description" placeholder="e.g., Supplier Payment" required>
                </div>
                
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="amount" min="0" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label>Payment Mode</label>
                    <select id="mode" required>
                        <option value="">Select Mode</option>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Card">Card</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-submit">Add Transaction</button>
            </form>
        </div>
    </div>

    <script src="ledger-script.js"></script>
</body>
</html>
